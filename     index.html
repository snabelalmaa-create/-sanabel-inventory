
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق جرد أسواق سنابل المع</title>
<style>
body{
font-family:Arial;
background:#081226;
color:white;
margin:0;
padding:0;
}
header{
padding:20px;
text-align:center;
background:#0d1b38;
font-size:28px;
font-weight:bold;
}
.container{
padding:15px;
}
.card{
background:#101d3d;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}
input,button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:18px;
}
input{
background:#1b2b55;
color:white;
}
button{
background:#d4a72c;
color:black;
font-weight:bold;
}
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:14px;
}
th,td{
border:1px solid #2f4479;
padding:8px;
text-align:center;
}
th{
background:#1a2b5a;
}
.success{
background:#0f7a3c;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>
<body>

<header>تطبيق جرد أسواق سنابل المع</header>

<div class="container">

<div class="card">
<h3>استيراد الأصناف CSV</h3>
<input type="file" id="csvFile" accept=".csv">
<button onclick="importCSV()">استيراد الأصناف</button>
<div id="msg"></div>
</div>

<div class="card">
<h3>الجرد</h3>
<input type="text" id="barcode" placeholder="اقرأ الباركود">
<input type="number" id="actualQty" placeholder="الكمية الفعلية">
<button onclick="saveCount()">حفظ الجرد</button>
<div id="itemInfo"></div>
</div>

<div class="card">
<h3>آخر عمليات الجرد</h3>
<table>
<thead>
<tr>
<th>الباركود</th>
<th>الصنف</th>
<th>النظام</th>
<th>الفعلي</th>
<th>الفرق</th>
<th>الوقت</th>
</tr>
</thead>
<tbody id="reportBody"></tbody>
</table>
</div>

</div>

<script>
let items = JSON.parse(localStorage.getItem("items") || "[]");
let reports = JSON.parse(localStorage.getItem("reports") || "[]");

document.getElementById("barcode").addEventListener("input", showItem);

function importCSV(){
const file = document.getElementById("csvFile").files[0];
if(!file){ alert("اختر ملف CSV"); return; }

const reader = new FileReader();
reader.onload = function(e){
const text = e.target.result;
const rows = text.split("\n");

items = [];

for(let i=1;i<rows.length;i++){
const cols = rows[i].split(",");
if(cols.length >= 4){
items.push({
barcode: cols[0]?.trim(),
name: cols[1]?.trim(),
qty: cols[2]?.trim(),
unit: cols[3]?.trim()
});
}
}

localStorage.setItem("items", JSON.stringify(items));

document.getElementById("msg").innerHTML =
'<div class="success">تم استيراد '+items.length+' صنف بنجاح</div>';
}
reader.readAsText(file);
}

function showItem(){
const code = document.getElementById("barcode").value.trim();
const item = items.find(x => x.barcode == code);

if(item){
document.getElementById("itemInfo").innerHTML =
`
<div class="success">
الصنف: ${item.name}<br>
الكمية بالنظام: ${item.qty}<br>
الوحدة: ${item.unit}
</div>
`;
}else{
document.getElementById("itemInfo").innerHTML = "";
}
}

function saveCount(){
const code = document.getElementById("barcode").value.trim();
const actual = Number(document.getElementById("actualQty").value);

const item = items.find(x => x.barcode == code);

if(!item){
alert("الصنف غير موجود");
return;
}

const diff = actual - Number(item.qty);

const record = {
barcode: item.barcode,
name: item.name,
systemQty: item.qty,
actualQty: actual,
diff: diff,
time: new Date().toLocaleString()
};

reports.unshift(record);

localStorage.setItem("reports", JSON.stringify(reports));

renderReports();

alert("تم حفظ الجرد بنجاح");

document.getElementById("barcode").value = "";
document.getElementById("actualQty").value = "";
document.getElementById("itemInfo").innerHTML = "";
}

function renderReports(){
const body = document.getElementById("reportBody");
body.innerHTML = "";

reports.forEach(r=>{
body.innerHTML += `
<tr>
<td>${r.barcode}</td>
<td>${r.name}</td>
<td>${r.systemQty}</td>
<td>${r.actualQty}</td>
<td>${r.diff}</td>
<td>${r.time}</td>
</tr>
`;
});
}

renderReports();
</script>

</body>
</html>
